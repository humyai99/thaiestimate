[package]
name = "thaiestimate"
version = "0.2.0"
edition = "2021"

[dependencies]
eframe = "0.29"
egui = "0.29"
rusqlite = { version = "0.31", features = ["bundled"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
pdfium-render = { version = "0.9.6", features = ["default"] }
rust_xlsxwriter = "0.104.0"
printpdf = "0.12.14"
